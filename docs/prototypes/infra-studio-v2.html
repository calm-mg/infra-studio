<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인프라 스튜디오 · 설계 캔버스</title>
<style>
:root{color-scheme:dark;--bg:#101217;--panel:#171a21;--line:#292e39;--ink:#edf0f7;--muted:#a3adbf;--blue:#a1adff;--teal:#71ddbd;--amber:#ffd092}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #aaaaff;outline-offset:3px}h1,h2,h3,p{margin:0}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:14px;background:#14161d}.logo{display:grid;place-items:center;background:#aab5ff;color:#14182d;border-radius:10px;font-size:20px;width:38px;height:38px}.brand{font-weight:850;font-size:16px;letter-spacing:-.045em}.sub{color:var(--muted);font-size:11px;margin-top:1px}.actions{margin-left:auto;display:flex;gap:8px}.btn{padding:7px 11px;background:#222630;border:1px solid #343949;border-radius:7px;font-size:12px}.btn:hover{background:#30384b}.btn.primary{background:#a4afff;color:#11162c;border-color:#a4afff;font-weight:800}.btn.primary:hover{background:#c2c9ff}.btn[aria-pressed=true]{background:#343a67;border-color:#a4afff}.layout{display:grid;grid-template-columns:211px minmax(0,1fr) 285px;min-height:calc(100svh - 68px)}.palette,.inspect{background:var(--panel);padding:20px 15px}.palette{border-right:1px solid var(--line)}.inspect{border-left:1px solid var(--line)}.eyebrow{color:#a4abc0;font:700 10px/1.5 Consolas,monospace;letter-spacing:.15em}.palette h2,.inspect h2{font-size:17px;letter-spacing:-.035em;margin-top:3px}.hint{color:var(--muted);font-size:12px;margin:5px 0 16px}.block{width:100%;background:#1f232d;border:1px solid #303643;border-radius:9px;padding:8px 9px;display:flex;align-items:center;gap:8px;text-align:left;margin:7px 0;font-size:12px;font-weight:750}.block:hover{border-color:#8797f8}.block span:last-child{margin-left:auto;color:#c3cbe0}.badge{display:grid;place-items:center;min-width:27px;height:27px;background:color-mix(in srgb,var(--accent) 17%,#1b202a);color:var(--accent);border-radius:6px;font-size:14px;font-weight:850}.center{min-width:0;display:flex;flex-direction:column}.top{padding:19px 20px 12px;display:flex;align-items:flex-end;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line)}h1{font-size:20px;letter-spacing:-.055em}.top .sub{margin-top:3px}.scroll{overflow:auto;background:#12151c;background-image:radial-gradient(#303646 1px,transparent 1px);background-size:18px 18px;flex:1;min-height:510px}.board{position:relative;min-width:720px;min-height:495px;height:100%;touch-action:pan-x pan-y}.zone{position:absolute;border:1px dashed #41475e;background:#2b335225;border-radius:13px;pointer-events:none}.zone span{position:absolute;top:10px;left:13px;color:#b7c1e3;font-size:11px;font-weight:800}.zone.remote{border-color:#35534f;background:#24494024}.zone.remote span{color:#a1cfbf}.wire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.edge{fill:none;stroke:#8699d3;stroke-width:2;pointer-events:stroke;cursor:pointer}.edge.chosen{stroke:#d4d9ff;stroke-width:3}.edgeLabel{fill:#c1cbee;stroke:#151923;stroke-width:6;paint-order:stroke;font-size:10px;text-anchor:middle;pointer-events:none}.node{position:absolute;width:144px;min-height:76px;border:1px solid #414b60;background:#202633;border-radius:11px;box-shadow:0 8px 12px #06091360;touch-action:none}.node.sel{outline:2px solid #a6b3ff;outline-offset:2px}.node.risk{border-color:#b88250}.nodeBody{display:flex;align-items:center;gap:7px;cursor:grab;text-align:left;background:none;border:0;width:100%;padding:9px 8px 5px}.nodeBody b,.node small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nodeBody>span:last-child{min-width:0;font-size:11px;color:#b4bed5}.nodeBody b{font-size:12px;color:#eff2fb}.node small{font-size:10px;padding:0 9px 7px;color:var(--muted)}.node.risk small{color:var(--amber)}.port{position:absolute;right:-9px;top:27px;width:17px;height:17px;border:1px solid #8194d3;background:#252f47;border-radius:50%;font-size:11px;line-height:12px;padding:0;color:#e9edff}.port:hover,.node.from .port{background:#a1adff;color:#15172b}.empty{position:absolute;top:145px;left:105px;width:350px;background:#1c212dcc;border:1px dashed #485572;border-radius:14px;padding:22px}.empty p{color:var(--muted);margin-top:5px}.status{padding:12px 20px;min-height:70px;border-top:1px solid var(--line);background:#191c24;color:var(--muted);font-size:12px}.status b{color:var(--teal);display:block;font-size:13px;margin-bottom:2px}.status.warn b{color:var(--amber)}.section{border-block-start:1px solid var(--line);padding-top:13px;margin-top:13px}.detail{color:#b5bfd2;font-size:12px}.detail a{color:#c0caff}.detail p{margin:5px 0 12px}.detail .btn{margin:5px 5px 0 0}.detail label{display:block;font-size:12px;color:#c8d0e1;margin-bottom:5px}select{width:100%;background:#242936;border:1px solid #424b61;border-radius:6px;padding:7px 8px;margin-bottom:10px}.danger{color:#ffb6a0}.legend{color:#aab4cc;padding-top:14px;font-size:11px}.legend b{color:#c6d0ee}.kbd{border:1px solid #3b4356;border-radius:4px;padding:0 4px}@media(max-width:1060px){.layout{grid-template-columns:165px minmax(0,1fr) 230px}.palette,.inspect{padding:15px 11px}}@media(max-width:790px){.layout{grid-template-columns:1fr}.palette,.inspect{border:none}.palette{border-bottom:1px solid var(--line)}#library{display:flex;gap:6px;flex-wrap:wrap}.block{width:auto;margin:0}.palette .hint{margin-bottom:7px}.scroll{min-height:486px}header{padding:0 11px}.inspect{border-top:1px solid var(--line)}.top{padding:10px 12px}}
</style></head><body>
<header><span class="logo" aria-hidden="true">◈</span><div><div class="brand">인프라 스튜디오</div><div class="sub">역할을 놓고, 연결을 바꿔보는 설계 작업대</div></div><div class="actions"><button class="btn" id="blank">빈 캔버스</button><button class="btn primary" id="example">로그 예제 불러오기</button></div></header>
<div class="layout"><aside class="palette"><div class="eyebrow">BLOCK LIBRARY</div><h2>블록 추가</h2><p class="hint">끌어서 놓거나 클릭해 추가</p><div id="library"></div><div class="legend"><b>연결 방법</b><br>블록 오른쪽 <span class="kbd">+</span> → 대상 블록 클릭</div></aside>
<main class="center"><div class="top"><div><h1 id="title">로그 수집 설계</h1><p class="sub">블록은 이동할 수 있고, 선 클릭 시 연결을 확인할 수 있어.</p></div><button class="btn" id="connect" aria-pressed="false">↗ 연결 모드</button></div><div class="scroll"><div class="board" id="board"><svg class="wire" id="wire" aria-label="연결선"></svg><div id="zones"></div><div id="nodes"></div></div></div><section class="status" id="status" aria-live="polite"></section></main>
<aside class="inspect"><div class="eyebrow">INSPECTOR</div><h2 id="inspectorTitle">블록 설정</h2><div class="detail" id="detail"></div></aside></div>
<script>
const types={
 app:{label:'앱 서버',mark:'▣',color:'#a9b4ff',items:['미정','Spring Boot','Go'],about:'요청을 처리하고 로그를 만드는 곳. 언어를 바꿔도 로그 출력 방식은 따로 정해야 해.'},
 file:{label:'로컬 로그 파일',mark:'≡',color:'#ffc487',items:['파일'],about:'서버 디스크에 쓰는 원본. 원격으로 전송한다고 원본이 자동으로 정리되진 않아.'},
 collect:{label:'로그 수집기',mark:'⇢',color:'#c5a9fa',items:['미정','CloudWatch Agent','Grafana Alloy','Vector'],about:'로그를 읽어서 지정된 저장소로 전송해. 수집기마다 지원하는 입력과 출력이 달라.'},
 store:{label:'로그 저장소',mark:'▤',color:'#79ddba',items:['미정','CloudWatch Logs','Loki'],about:'원격 로그를 저장하고 검색할 수 있게 해. 여기서 보존 정책을 바꿔도 로컬에는 적용되지 않아.'}
};
const compat={'CloudWatch Agent':['CloudWatch Logs'],'Grafana Alloy':['Loki'],Vector:['CloudWatch Logs','Loki']};
const docs={'CloudWatch Agent':'https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Install-CloudWatch-Agent.html','CloudWatch Logs':'https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html','Grafana Alloy':'https://grafana.com/docs/alloy/latest/','Loki':'https://grafana.com/docs/loki/latest/','Vector':'https://vector.dev/docs/'};
const $=id=>document.getElementById(id);
let ns=[],es=[],seq=0,selected=null,edgeSel=null,linking=false,from=null,ex=false,notice='';
function node(id){return ns.find(n=>n.id===id)}
function edgeKind(a,b){return { 'app-file':'파일에 쓰기','file-collect':'읽기','collect-store':'전송' }[a.t+'-'+b.t]}
function localRisk(n){return n.t==='file'&&!n.rotate&&es.some(e=>e.b===n.id&&node(e.a)?.t==='app')}
function add(t,x=125+(seq%3)*53,y=100+(seq%4)*61,{value,rotate=false,quiet=false}={}){let n={id:'n'+(++seq),t,x,y,v:value??types[t].items[0],rotate};ns.push(n);if(!quiet){selected=n.id;edgeSel=null;notice='';render()}return n.id}
function setup(example){
 ex=example;ns=[];es=[];seq=0;selected=null;edgeSel=null;linking=false;from=null;notice='';
 if(example){const a=add('app',50,108,{value:'Spring Boot',quiet:true}), f=add('file',261,108,{quiet:true}), c=add('collect',471,108,{value:'CloudWatch Agent',quiet:true}), s=add('store',471,322,{value:'CloudWatch Logs',quiet:true});es=[{a,b:f},{a:f,b:c},{a:c,b:s}];selected=s}
 render();
}
function sendLink(id){if(!from){from=id;notice='';render();return}if(from===id){from=null;render();return}const a=node(from),b=node(id);if(!edgeKind(a,b)){notice='이 실습에서 지원하는 연결은 앱 서버 → 로컬 파일 → 수집기 → 저장소야.';render();return}
 if(!es.some(e=>e.a===from&&e.b===id))es.push({a:from,b:id});selected=id;edgeSel=null;from=null;linking=false;notice='';render()}
function pick(id){if(linking){sendLink(id);return}selected=id;edgeSel=null;notice='';render()}
function edges(){const s=$('wire');s.innerHTML='<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="#8699d3"/></marker></defs>';
 es.forEach((e,i)=>{const a=node(e.a),b=node(e.b);if(!a||!b)return;let x1,y1,x2,y2,d,lx,ly;
 if(Math.abs(a.x-b.x)<145&&b.y>a.y+75){x1=a.x+72;y1=a.y+76;x2=b.x+72;y2=b.y;let m=(y1+y2)/2;d='M'+x1+' '+y1+' C'+x1+' '+m+' '+x2+' '+m+' '+x2+' '+y2;lx=(x1+x2)/2+20;ly=m+3}
 else{x1=a.x+144;y1=a.y+37;x2=b.x;y2=b.y+37;let bend=Math.max(23,Math.abs(x2-x1)*.48);d='M'+x1+' '+y1+' C'+(x1+bend)+' '+y1+' '+(x2-bend)+' '+y2+' '+x2+' '+y2;lx=(x1+x2)/2;ly=(y1+y2)/2-8}
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class','edge'+(edgeSel===i?' chosen':''));p.setAttribute('marker-end','url(#arrow)');p.onclick=()=>{edgeSel=i;selected=null;notice='';render()};s.append(p);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','edgeLabel');t.setAttribute('x',lx);t.setAttribute('y',ly);t.textContent=edgeKind(a,b);s.append(t)
 })}
function drawNodes(){
 $('nodes').innerHTML='';
 if(!ns.length)$('nodes').innerHTML='<div class="empty"><h2>첫 블록을 놓아봐</h2><p>왼쪽에서 앱 서버를 추가하거나, 위에서 로그 예제를 불러와 바로 연결을 바꿔봐.</p></div>';
 for(const n of ns){const t=types[n.t],d=document.createElement('div');d.className='node'+(selected===n.id?' sel':'')+(localRisk(n)?' risk':'')+(from===n.id?' from':'');d.dataset.id=n.id;d.style.left=n.x+'px';d.style.top=n.y+'px';d.style.setProperty('--accent',t.color);d.innerHTML='<button class="nodeBody"><span class="badge">'+t.mark+'</span><span><b>'+t.label+'</b>'+n.v+'</span></button><small>'+(localRisk(n)?'⚠ 보존 한도 없음':n.t==='file'&&n.rotate?'✓ 파일 순환 켜짐':{app:'로그 생성',file:'EC2 디스크 원본',collect:'수집 및 전송',store:'원격 보존 및 조회'}[n.t])+'</small><button class="port" aria-label="'+t.label+'에서 연결">+</button>';
 const b=d.querySelector('.nodeBody');let moved=false,origin=null;
 b.addEventListener('pointerdown',ev=>{if(ev.button!==0||linking)return;moved=false;origin={x:ev.clientX,y:ev.clientY,nx:n.x,ny:n.y};b.setPointerCapture(ev.pointerId)});
 b.addEventListener('pointermove',ev=>{if(!origin)return;const dx=ev.clientX-origin.x,dy=ev.clientY-origin.y;if(!moved&&Math.hypot(dx,dy)<4)return;moved=true;n.x=Math.max(8,Math.min($('board').clientWidth-152,origin.nx+dx));n.y=Math.max(8,Math.min($('board').clientHeight-90,origin.ny+dy));d.style.left=n.x+'px';d.style.top=n.y+'px';edges()});
 b.addEventListener('pointerup',()=>{origin=null});b.addEventListener('pointercancel',()=>{origin=null;moved=false});b.onclick=()=>{if(moved){moved=false;selected=n.id;edgeSel=null;render();return}pick(n.id)};
 d.querySelector('.port').onclick=()=>{linking=true;from=n.id;selected=n.id;edgeSel=null;notice='';render()};$('nodes').append(d)
 }}
function inspect(){
 const n=node(selected);const e=es[edgeSel];const d=$('detail');$('inspectorTitle').textContent=n?types[n.t].label:e?'연결 설정':'블록 설정';
 if(e){d.innerHTML='<div class="section"><p>'+types[node(e.a).t].label+' → '+types[node(e.b).t].label+' · '+edgeKind(node(e.a),node(e.b))+'</p><button class="btn danger" id="removeEdge">연결 끊기</button></div>';$('removeEdge').onclick=()=>{es.splice(edgeSel,1);edgeSel=null;render()};return}
 if(!n){d.innerHTML='<p>블록이나 연결선을 선택해 역할과 설정을 확인해 봐.</p>';return}
 const t=types[n.t];d.innerHTML='<p>'+t.about+'</p><div class="section">'+(t.items.length>1?'<label for="implementation">사용할 기술</label><select id="implementation">'+t.items.map(v=>'<option'+(n.v===v?' selected':'')+'>'+v+'</option>').join('')+'</select>':'')+(n.t==='file'?'<button class="btn" id="rotate" aria-pressed="'+n.rotate+'">파일 순환 '+(n.rotate?'켜짐':'꺼짐')+'</button><p>오래된 아카이브를 용량 한도에 맞춰 정리하는 설정이야.</p>':'')+(docs[n.v]?'<p><a href="'+docs[n.v]+'" target="_blank" rel="noopener">공식 문서 ↗</a></p>':'')+'</div><div class="section"><button class="btn danger" id="remove">블록 삭제</button></div>';
 if($('implementation'))$('implementation').onchange=ev=>{n.v=ev.target.value;notice='';render();$('implementation').focus()};
 if($('rotate'))$('rotate').onclick=()=>{n.rotate=!n.rotate;notice='';render();$('rotate').focus()};
 $('remove').onclick=()=>{ns=ns.filter(x=>x.id!==n.id);es=es.filter(x=>x.a!==n.id&&x.b!==n.id);selected=null;if(from===n.id){from=null;linking=false}render()};
}
function status(){
 const risk=ns.some(localRisk),issues=es.some(e=>{const a=node(e.a),b=node(e.b);return a.t==='collect'&&b.t==='store'&&a.v!=='미정'&&b.v!=='미정'&&!compat[a.v]?.includes(b.v)});
 const rotated=ns.some(n=>n.t==='file'&&n.rotate&&es.some(e=>e.b===n.id));
 const s=$('status');s.className='status'+(risk||issues?' warn':'');
 if(notice){s.innerHTML='<b>연결 확인</b>'+notice;return}
 if(linking){s.innerHTML='<b>연결 모드</b>'+(from?'이제 연결할 대상 블록을 선택해.':'출발 블록을 먼저 클릭해.');return}
 s.innerHTML=(!ns.length?'<b>아직 배치된 블록이 없어</b>예제를 불러오거나 블록을 추가해 직접 연결해봐.':risk?'<b>⚠ 로컬 디스크: 로그가 계속 쌓여</b>원격 저장소를 바꿔도 원본 파일은 그대로야. 로컬 파일을 선택해 순환을 켜봐.':rotated?'<b>✓ 로컬 로그에 순환 정책이 있어</b>오래된 파일을 정리하도록 설정됐어. 실제 사용량은 측정이 필요해.':'<b>연결 상태를 확인할 수 있어</b>블록을 잇거나 기술을 바꾸면 구조에 따른 안내가 나타나.')+(issues?'<div>⚠ 이 시안에 정의되지 않은 수집기·저장소 조합이야. 예제에서 Loki를 쓰려면 Alloy나 Vector를 비교해봐.</div>':'');
}
function render(){$('title').textContent=ex?'로그 수집 설계':'새 인프라 설계';$('connect').setAttribute('aria-pressed',String(linking));$('zones').innerHTML=ex?'<div class="zone" style="left:24px;top:62px;width:630px;height:162px"><span>EC2 · 애플리케이션 호스트</span></div><div class="zone remote" style="left:421px;top:271px;width:233px;height:151px"><span>호스트 밖 · 원격 저장소</span></div>':'';drawNodes();edges();inspect();status()}
for(const [k,t] of Object.entries(types)){const b=document.createElement('button');b.className='block';b.draggable=true;b.style.setProperty('--accent',t.color);b.innerHTML='<span class="badge">'+t.mark+'</span>'+t.label+'<span>+</span>';b.onclick=()=>add(k);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',k);e.dataTransfer.effectAllowed='copy'};$('library').append(b)}
$('board').ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'};
$('board').ondrop=e=>{e.preventDefault();const k=e.dataTransfer.getData('text/plain');if(!Object.hasOwn(types,k))return;const r=$('board').getBoundingClientRect();add(k,Math.max(8,Math.min(r.width-152,e.clientX-r.left-68)),Math.max(8,Math.min(r.height-90,e.clientY-r.top-34)))};
$('connect').onclick=()=>{linking=!linking;from=null;notice='';render()};$('blank').onclick=()=>setup(false);$('example').onclick=()=>setup(true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){linking=false;from=null;notice='';render()}});
setup(true);
</script></body></html>
